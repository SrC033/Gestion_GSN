<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GSN Sync · Sincronizador</title>
    
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --bg-primary: #0b1120;
            --bg-secondary: #111d2e;
            --bg-card: rgba(22, 42, 68, 0.45);
            --bg-input: rgba(22, 42, 68, 0.35);
            --border-color: rgba(56, 98, 148, 0.25);
            --border-hover: rgba(56, 166, 160, 0.4);
            
            --text-primary: #eef3f8;
            --text-secondary: #94b0c9;
            --text-muted: #5a7a96;
            
            --accent: #2bc5b8;
            --accent-dark: #1d9e94;
            --accent-glow: rgba(43, 197, 184, 0.15);
            
            --success: #47b881;
            --success-bg: rgba(71, 184, 129, 0.12);
            --danger: #e86a6a;
            --danger-bg: rgba(232, 106, 106, 0.12);
            --warning: #e8b84a;
            --warning-bg: rgba(232, 184, 74, 0.12);
            
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }
        
        /* ============================================================
           CONTAINER
           ============================================================ */
        .container {
            max-width: 640px;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 32px 36px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-dark), var(--accent));
            opacity: 0.7;
        }
        
        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .header .logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            color: white;
        }
        
        .header .title-group {
            flex: 1;
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        
        .header h1 span {
            color: var(--accent);
        }
        
        .header .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.2px;
            margin-top: 1px;
        }
        
        .header .badge {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid rgba(71, 184, 129, 0.15);
            white-space: nowrap;
        }
        
        .header .badge.offline {
            background: var(--danger-bg);
            color: var(--danger);
            border-color: rgba(232, 106, 106, 0.15);
        }
        
        /* ============================================================
           FIELDS
           ============================================================ */
        .fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .field-group label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-secondary);
        }
        
        .field-group input {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 13px;
            font-family: var(--font);
            outline: none;
            transition: all 0.25s ease;
            width: 100%;
        }
        
        .field-group input::placeholder {
            color: var(--text-muted);
            font-size: 12px;
        }
        
        .field-group input:focus {
            border-color: var(--border-hover);
            background: rgba(22, 42, 68, 0.5);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        .field-group input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* ============================================================
           INFO ROW
           ============================================================ */
        .info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 18px;
        }
        
        .info-row .label {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .info-row .label .icon {
            font-size: 14px;
        }
        
        .info-row .value {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .info-row .value .highlight {
            color: var(--accent);
        }
        
        /* ============================================================
           STATUS GRID
           ============================================================ */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        
        .status-item {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            text-align: center;
            transition: border-color 0.3s ease;
        }
        
        .status-item:hover {
            border-color: var(--border-hover);
        }
        
        .status-item .label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
        }
        
        .status-item .value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 3px;
            transition: color 0.3s ease;
        }
        
        .status-item .value .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        
        .status-item .value .dot.green {
            background: var(--success);
            box-shadow: 0 0 8px rgba(71, 184, 129, 0.3);
        }
        
        .status-item .value .dot.red {
            background: var(--danger);
            box-shadow: 0 0 8px rgba(232, 106, 106, 0.3);
        }
        
        .status-item .value .dot.yellow {
            background: var(--warning);
            box-shadow: 0 0 8px rgba(232, 184, 74, 0.3);
        }
        
        .status-item .value.green {
            color: var(--success);
        }
        
        .status-item .value.red {
            color: var(--danger);
        }
        
        .status-item .value.yellow {
            color: var(--warning);
        }
        
        /* ============================================================
           BUTTONS
           ============================================================ */
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .btn {
            padding: 10px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }
        
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(43, 197, 184, 0.3);
        }
        
        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid rgba(232, 106, 106, 0.15);
        }
        
        .btn-danger:hover:not(:disabled) {
            background: rgba(232, 106, 106, 0.2);
            transform: translateY(-1px);
        }
        
        .btn-success {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid rgba(71, 184, 129, 0.15);
        }
        
        .btn-success:hover:not(:disabled) {
            background: rgba(71, 184, 129, 0.2);
            transform: translateY(-1px);
        }
        
        .btn-icon {
            font-size: 16px;
        }
        
        /* ============================================================
           MESSAGE
           ============================================================ */
        .message {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            min-height: 44px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .message .emoji {
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .message .text {
            flex: 1;
            color: var(--text-primary);
        }
        
        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .footer .brand {
            color: var(--text-secondary);
        }
        
        .footer .brand strong {
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .footer .time {
            font-variant-numeric: tabular-nums;
        }
        
        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 620px) {
            body {
                padding: 12px;
            }
            
            .container {
                padding: 20px;
                border-radius: 10px;
            }
            
            .fields {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .status-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .actions {
                grid-template-columns: 1fr;
            }
            
            .header .badge {
                font-size: 9px;
                padding: 3px 10px;
            }
            
            .header h1 {
                font-size: 17px;
            }
            
            .header .logo {
                width: 36px;
                height: 36px;
                font-size: 17px;
            }
            
            .status-item .value {
                font-size: 14px;
            }
            
            .footer {
                flex-direction: column;
                gap: 4px;
                text-align: center;
            }
        }
        
        @media (max-width: 400px) {
            .status-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ============================================================
        HEADER
        ============================================================ -->
        <div class="header">
            <div class="logo">📊</div>
            <div class="title-group">
                <h1>GSN <span>Sync</span></h1>
                <div class="subtitle">Sincronización en tiempo real</div>
            </div>
            <span class="badge offline" id="statusBadge">● Desconectado</span>
        </div>
        
        <!-- ============================================================
        CONEXIÓN
        ============================================================ -->
        <div class="fields">
            <div class="field-group">
                <label>🔗 Google Sheet</label>
                <input type="text" id="inputUrl" placeholder="https://docs.google.com/spreadsheets/d/..." />
            </div>
            <div class="field-group">
                <label>🔑 ID del Sheet</label>
                <input type="text" id="inputKey" placeholder="15brfnN9-wvYWroColjTFSq5aCRFVDi3e" />
            </div>
        </div>
        
        <!-- ============================================================
        ARCHIVO
        ============================================================ -->
        <div class="info-row">
            <span class="label"><span class="icon">📁</span> Archivo Excel</span>
            <span class="value" id="filePath"><span class="highlight">Cargando...</span></span>
        </div>
        
        <!-- ============================================================
        ESTADO
        ============================================================ -->
        <div class="status-grid">
            <div class="status-item">
                <div class="label">📡 Estado</div>
                <div class="value yellow" id="statusValue">
                    <span class="dot yellow"></span> Esperando
                </div>
            </div>
            <div class="status-item">
                <div class="label">📋 Registros</div>
                <div class="value" id="registrosValue">0</div>
            </div>
            <div class="status-item">
                <div class="label">🔄 Monitoreo</div>
                <div class="value red" id="monitoreoStatus">
                    <span class="dot red"></span> Detenido
                </div>
            </div>
        </div>
        
        <!-- ============================================================
        ACCIONES
        ============================================================ -->
        <div class="actions">
            <button class="btn btn-primary" id="btnConectar">
                <span class="btn-icon">▶</span> Conectar
            </button>
            <button class="btn btn-danger" id="btnDetener" disabled>
                <span class="btn-icon">⏹</span> Detener
            </button>
            <button class="btn btn-success" id="btnSincronizar">
                <span class="btn-icon">⟳</span> Sincronizar
            </button>
        </div>
        
        <!-- ============================================================
        MENSAJE
        ============================================================ -->
        <div class="message" id="mensajeBox">
            <span class="emoji">💡</span>
            <span class="text" id="mensajeTexto">Configura la URL y KEY, luego presiona "Conectar"</span>
        </div>
        
        <!-- ============================================================
        FOOTER
        ============================================================ -->
        <div class="footer">
            <span class="brand"><strong>Grupo GSN</strong> · Gestión de Distribución</span>
            <span class="time" id="fechaHora"></span>
        </div>
    </div>

    <script>
        // ============================================================
        // SOCKET.IO
        // ============================================================
        const socket = io();
        
        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        
        const statusBadge = $('statusBadge');
        const statusValue = $('statusValue');
        const registrosValue = $('registrosValue');
        const monitoreoStatus = $('monitoreoStatus');
        const filePath = $('filePath');
        const mensajeTexto = $('mensajeTexto');
        const mensajeBox = $('mensajeBox');
        const inputUrl = $('inputUrl');
        const inputKey = $('inputKey');
        const btnConectar = $('btnConectar');
        const btnDetener = $('btnDetener');
        const btnSincronizar = $('btnSincronizar');
        const fechaHora = $('fechaHora');
        
        let conectado = false;
        
        // ============================================================
        // ACTUALIZAR UI
        // ============================================================
        function actualizarUI(estado) {
            const isActive = estado.monitoreando === true;
            const isConnected = estado.conectado === true;
            
            // Badge
            if (isActive) {
                statusBadge.textContent = '● Activo';
                statusBadge.className = 'badge';
            } else if (isConnected) {
                statusBadge.textContent = '● En espera';
                statusBadge.className = 'badge offline';
            } else {
                statusBadge.textContent = '● Desconectado';
                statusBadge.className = 'badge offline';
            }
            
            // Estado principal
            if (isActive) {
                statusValue.innerHTML = '<span class="dot green"></span> Activo';
                statusValue.className = 'value green';
                monitoreoStatus.innerHTML = '<span class="dot green"></span> Monitoreando';
                monitoreoStatus.className = 'value green';
                btnConectar.disabled = true;
                btnDetener.disabled = false;
                conectado = true;
            } else if (isConnected) {
                statusValue.innerHTML = '<span class="dot yellow"></span> En espera';
                statusValue.className = 'value yellow';
                monitoreoStatus.innerHTML = '<span class="dot red"></span> Detenido';
                monitoreoStatus.className = 'value red';
                btnConectar.disabled = true;
                btnDetener.disabled = true;
                conectado = true;
            } else {
                statusValue.innerHTML = '<span class="dot red"></span> Desconectado';
                statusValue.className = 'value red';
                monitoreoStatus.innerHTML = '<span class="dot red"></span> Detenido';
                monitoreoStatus.className = 'value red';
                btnConectar.disabled = false;
                btnDetener.disabled = true;
                conectado = false;
            }
            
            // Registros
            registrosValue.textContent = estado.total_registros || 0;
            
            // Archivo
            const archivo = estado.archivo_excel || '';
            if (archivo && archivo !== 'No encontrado') {
                const nombre = archivo.split('\\').pop() || archivo.split('/').pop() || 'No encontrado';
                filePath.innerHTML = `<span class="highlight">${nombre}</span>`;
            } else {
                filePath.textContent = 'No se encontró archivo';
            }
            
            // Mensaje
            const msg = estado.mensaje || 'Esperando...';
            const emojis = ['✅', '❌', '🔄', '📝', '👀', '⏹️', '💡', '⚠️', '🔴', '🟢', '📂', '📁', '🔗', '▶', '⏳'];
            let emoji = '💡';
            let texto = msg;
            for (const e of emojis) {
                if (msg.includes(e)) {
                    emoji = e;
                    texto = msg.replace(e, '').trim();
                    break;
                }
            }
            mensajeTexto.textContent = texto || msg;
            mensajeBox.querySelector('.emoji').textContent = emoji;
        }
        
        // ============================================================
        // FECHA
        // ============================================================
        function actualizarFecha() {
            const now = new Date();
            fechaHora.textContent = now.toLocaleString('es-NI', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
        }
        setInterval(actualizarFecha, 1000);
        actualizarFecha();
        
        // ============================================================
        // SOCKET EVENTS
        // ============================================================
        socket.on('connect', () => {
            console.log('🟢 Conectado al servidor');
        });
        
        socket.on('disconnect', () => {
            console.log('🔴 Desconectado');
            statusValue.innerHTML = '<span class="dot red"></span> Desconectado';
            statusValue.className = 'value red';
            conectado = false;
            btnConectar.disabled = false;
            btnDetener.disabled = true;
        });
        
        socket.on('estado_actualizado', actualizarUI);
        
        socket.on('sincronizacion_completa', (data) => {
            console.log('✅ Sincronización completa:', data);
            actualizarFecha();
        });
        
        // ============================================================
        // BOTONES
        // ============================================================
        btnConectar.addEventListener('click', () => {
            const url = inputUrl.value.trim();
            const key = inputKey.value.trim();
            
            let sheetId = key;
            if (url) {
                const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
                if (match) sheetId = match[1];
            }
            
            if (!sheetId) {
                mensajeTexto.textContent = '⚠️ Ingresa la URL o el ID del Google Sheet';
                mensajeBox.querySelector('.emoji').textContent = '⚠️';
                return;
            }
            
            inputKey.value = sheetId;
            btnConectar.disabled = true;
            btnConectar.innerHTML = '<span class="btn-icon">⏳</span> Conectando...';
            
            socket.emit('conectar', { url, key: sheetId });
            
            setTimeout(() => {
                btnConectar.innerHTML = '<span class="btn-icon">▶</span> Conectar';
            }, 3000);
        });
        
        btnDetener.addEventListener('click', () => {
            btnDetener.disabled = true;
            btnDetener.innerHTML = '<span class="btn-icon">⏳</span> Deteniendo...';
            socket.emit('detener');
            setTimeout(() => {
                btnDetener.innerHTML = '<span class="btn-icon">⏹</span> Detener';
            }, 2000);
        });
        
        btnSincronizar.addEventListener('click', () => {
            if (!conectado && !document.querySelector('.status-item .value.green')) {
                mensajeTexto.textContent = '⚠️ Primero presiona "Conectar"';
                mensajeBox.querySelector('.emoji').textContent = '⚠️';
                return;
            }
            btnSincronizar.disabled = true;
            btnSincronizar.innerHTML = '<span class="btn-icon">⏳</span> Sincronizando...';
            socket.emit('sincronizar');
            setTimeout(() => {
                btnSincronizar.disabled = false;
                btnSincronizar.innerHTML = '<span class="btn-icon">⟳</span> Sincronizar';
            }, 4000);
        });
        
        // ============================================================
        // ESTADO INICIAL
        // ============================================================
        fetch('/api/estado')
            .then(res => res.json())
            .then(estado => actualizarUI(estado))
            .catch(() => {
                statusValue.innerHTML = '<span class="dot red"></span> Error';
                statusValue.className = 'value red';
            });
        
        // Enter para conectar
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !btnConectar.disabled) {
                btnConectar.click();
            }
        });
    </script>
</body>
</html>
